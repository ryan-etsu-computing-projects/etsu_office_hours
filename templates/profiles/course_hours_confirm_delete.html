{% extends '../base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center">Delete Course Office Hours</h3>
                <p class="text-center">
                    Are you sure you want to delete office hours for:<br>
                    <strong>{{ course_hours.course_name }}</strong>?
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a href="{% url 'profiles:profile_detail' user.userprofile.pk %}" 
                           class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
