{% extends '../base.html' %}
{% load form_filters %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-check-circle display-1 text-success mb-4"></i>
                <h3 class="card-title mb-4">Password Reset Complete</h3>
                <p>Your password has been set. You may go ahead and log in now.</p>
                <div class="d-grid">
                    <a href="{% url 'users:login' %}" class="btn btn-primary mt-3">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
